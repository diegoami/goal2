# harness.lock: the harness this repository copied from diegoami/goal2-archaeology, itself
# adapted from diegoami/harness_imperial (profile full, b8c6cde; see goal2-archaeology's own lock).
# A bump: copy goal2-archaeology's files at the new commit, carry the `adapt` changes over, and
# re-hash. `local` lines are goal2's own files the port changed or added.
# Verify:  grep -E '^[0-9a-f]{64}  ' harness.lock | sha256sum -c --quiet
source diegoami/goal2-archaeology 8dc4dc1 (#149: the session or its agent implements, OpenCode reviews)
copied 2026-10-12 (the owner: "Bring the harness to goal too")
adapt .claude/hooks/session-start.sh  (Sol for hard reviews)
adapt .claude/skills/delegate/SKILL.md  (recording the answers cites "Choosing models" rule 2)
adapt .claude/skills/run-task/SKILL.md  (squash merges (rule 7); preserve local branches and worktrees; Sol for hard reviews; no Ghidra; monitoring rules cited as "Choosing models" rules; units goal2r-<name>)
adapt .opencode/agents/reviewer.md  (the grant outside /tmp is the goal2-archaeology checkout (tools/check_provenance.py reads it), not the DOSBox-X bundle)
adapt CLAUDE.md  (goal2-archaeology's rules 1-16 and "Choosing models" (numbered as there, the skills cite them; rule 7 squash-only), then goal2's own six rules word for word as 17-22)
adapt docs/environment.md  (without the DOSBox-X and Ghidra sections; a shared machine without project specifics; the reviewer's grant is the goal2-archaeology checkout; Alibaba cites "Choosing models" rule 3)
adapt docs/process.md  (#165 bounded flagged terminal-period recovery; without §11 (reverse engineering) and §13 (the named view); goal2's rules 17-20 in the briefs; T34/T14 named as goal2-archaeology's; monitoring rules cited as "Choosing models" rules; units goal2r-<name>)
adapt docs/tasks/TEMPLATE.md  (goal2's Kind and Evidence lines; a measuring task owns measurements/T<nn>/**)
adapt tests/test_agent_permissions.py  (checks the goal2-archaeology checkout grant)
adapt tools/harness/lib/named.mjs  (the blocked list cites "Choosing models" rule 3 (a comment))
adapt tools/harness/lib/common.mjs  (T24 client detection; preserve legacy Claude endpoints and OpenAI review boundary)
adapt tools/harness/lib/switch.mjs  (T24 separate Codex implementer default and native model validation)
adapt tools/harness/switch-model.mjs  (T24 pass the detected client to model switching)
adapt tools/harness/review.mjs  (T24 client/provider diagnostics; retain reviewer family guard)
adapt harness.json  (T24 Codex defaultsByClient.codex; retain Claude default and reviewer roster)
adapt .claude/skills/switch-model/SKILL.md  (T24 client-specific defaults, retain Claude dispatch)
adapt tools/harness/lib/chain.mjs  (#165 bounded flagged terminal-period recovery)
adapt tools/harness/lib/review-selftest.mjs  (#165 recovery, identity, ambiguity and posting regressions)
local README.md  (goal2's own: links the plan; the evidence-tags rule is now 17)
local PROVENANCE.md  (goal2's own: the vendoring rule is now 18)
local AGENTS.md  (Codex entrypoint sharing the numbered rules and task process)
