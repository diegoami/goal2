name: CI

# [designed: owner, #127, 2026-10-20] Optional fresh-runner verification; local checks gate merges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_premerge.py --expected-head "$GITHUB_SHA"
