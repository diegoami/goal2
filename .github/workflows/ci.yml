name: Linux

# [designed: owner, 2026-10-29, T146] The Linux gate on every PR and on main, provisioned like the
# Windows one (#278) and like a prepared local checkout (tools/cloud_setup.sh): the extras, the
# original files from the owner's Drive, the goal2-archaeology clone, offscreen Qt and dummy SDL.
# Nothing of the original game leaves the runner: no .cache/ content and no original-game file is
# uploaded or cached, and the Drive token is only read from the secret.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slow:
        description: Run the slow tests too (milestone candidates)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    # A slow run took 25.5 min of gate and 27.2 min in all (measurements/T146/run-40807702296-v1.json).
    timeout-minutes: 300   # [designed: owner, 2026-10-31, #489] T151 puts every match on the port; re-measured after its first full run
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      GOAL2_ARCHAEOLOGY: ${{ github.workspace }}/../goal2-archaeology
    steps:
      - uses: actions/checkout@v4
        with:
          # check_premerge compares with origin/main and wants the PR's own head, not the merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System libraries for offscreen Qt and SDL (as tools/cloud_setup.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 > /dev/null
      - name: Install goal2
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e '.[desktop,watched,match-view]'
      - name: Original-game files (owner's Drive)
        env:
          GOAL2_RCLONE_TOKEN: ${{ secrets.GOAL2_RCLONE_TOKEN }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$GOAL2_RCLONE_TOKEN" ]; then
            if [ "$FORK" = true ]; then
              echo "A fork PR has no GOAL2_RCLONE_TOKEN: tests needing the original files skip."
              exit 0
            fi
            echo "GOAL2_RCLONE_TOKEN is unset on a same-repository run: refusing to turn the original-file tests into skips."
            exit 1
          fi
          version=v1.75.2;zip=rclone-$version-linux-amd64.zip
          curl -sSfL "https://downloads.rclone.org/$version/$zip" -o "$RUNNER_TEMP/$zip"
          curl -sSfL "https://downloads.rclone.org/$version/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $zip\$" SHA256SUMS | sha256sum -c -)
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rclone-$version-linux-amd64" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/rclone-$version-linux-amd64:$PATH"
          folder=$(python -c "import json,re;print(re.search(r'folders/([\w-]+)',json.load(open('artifacts.json'))['drive']['folderUrl']).group(1))")
          rclone config create goal2drive drive scope=drive root_folder_id="$folder" token="$GOAL2_RCLONE_TOKEN" --non-interactive > /dev/null
          python tools/artifacts.py pull
          python tools/check_goaldat.py .cache/GOAL.DAT > /dev/null && echo "GOAL.DAT verified"
      - name: goal2-archaeology (full clone; check_provenance needs its pinned commits)
        run: git clone -q https://github.com/diegoami/goal2-archaeology.git "$GOAL2_ARCHAEOLOGY"
      - name: Game tests and pre-merge checks
        run: |
          slow=
          [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.slow }}" = true ] && slow=--slow
          # [designed: owner, 2026-10-31, #487] the automatic slow runs play one case per batch test; a slow dispatch, all
          [ -z "$slow" ] && export GOAL2_CASES=1
          start=$(date +%s)
          # The wall time is printed whether the gate passes or fails, then the gate's status is the step's.
          status=0
          python tools/check_premerge.py --expected-head "$(git rev-parse HEAD)" $slow 2>&1 | tee linux-premerge.log || status=$?
          echo "gate wall time: $(( $(date +%s) - start )) s" | tee -a linux-premerge.log
          exit $status
      - name: Keep only logs
        if: always()
        run: |
          mkdir -p upload
          cp linux-premerge.log upload/ 2>/dev/null || true
          # [designed: #278] Refuse to upload anything with an original-game extension.
          if find upload -type f | grep -iE '\.(exe|dat|hlp|hil|pif|bat|sav|gl|g2save)$'; then
            echo "an original-game file reached the upload; refusing" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-evidence
          path: upload
          if-no-files-found: ignore
