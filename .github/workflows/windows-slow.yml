name: Windows slow

# [designed: owner, 2026-11-07] Full suites run on integrated milestone candidates,
# or an explicitly justified investigation. No PR/push/periodic dispatch; focused
# task checks and hosted fast regression gates protect PRs. No case/assertion/limit reduced.
# Dispatch requires repository write access. Offscreen Qt/dummy SDL; originals stay private.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-slow:
    if: github.event_name == 'workflow_dispatch'
    # A replacement dispatch supersedes only the same ref.
    concurrency:
      group: windows-slow-${{ github.ref }}
      cancel-in-progress: true
    runs-on: [goal2-slow]
    timeout-minutes: 300   # [designed: owner, 2026-10-31, #489] as the hosted runs' limit
    defaults:
      run:
        # bash on a Windows PATH can be WSL's; the runner has no admin rights, so no setup-python for CPython
        # (PyPy's is a plain download into the runner's tool cache).
        # Git Bash by its short path: the runner refused the quoted "C:\Program Files\..." (run 41293719862)
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      GOAL2_ARCHAEOLOGY: ${{ github.workspace }}/../goal2-archaeology
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the explicitly dispatched ref's exact head.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: PyPy 3.11 for the match workers (T152; not on PATH, the UI and tests stay on CPython)
        # [designed: #494] without it the workers fall back to CPython, about 4 times slower, and three
        # slow modules hit their time limits (run 41302324795: test_campaign_competitive_match,
        # test_watched_jobs, test_watched_pitch_jobs; 10900 s)
        id: pypy
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy3.11'
          update-environment: false
      - name: The match workers' interpreter
        run: echo "GOAL2_ENGINE_PYTHON=${{ steps.pypy.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Python 3.13 (the PC's own) in a fresh venv
        run: |
          py -3.13 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
      - name: Install goal2
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e '.[desktop,watched,match-view]'
      - name: Original-game files (owner's Drive, through the runner's mirror)
        env:
          GOAL2_RCLONE_TOKEN: ${{ secrets.GOAL2_RCLONE_TOKEN }}
        run: |
          version=v1.75.2;zip=rclone-$version-windows-amd64.zip
          curl -sSfL "https://downloads.rclone.org/$version/$zip" -o "$RUNNER_TEMP/$zip"
          curl -sSfL "https://downloads.rclone.org/$version/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $zip\$" SHA256SUMS | sha256sum -c -)
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/rclone-$version-windows-amd64:$PATH"
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf"
          folder=$(python -c "import json,re;print(re.search(r'folders/([\w-]+)',json.load(open('artifacts.json'))['drive']['folderUrl']).group(1))")
          rclone config create goal2drive drive scope=drive root_folder_id="$folder" token="$GOAL2_RCLONE_TOKEN" --non-interactive > /dev/null
          # [designed: owner, 2026-11-01, #493] a mirror of the Drive folder that outlives the work folder (checkout
          # wipes .cache/): sync fetches only what changed (a full pull took 143-312 s), the run gets a local copy
          mirror="$(cygpath -m "$LOCALAPPDATA")/goal2-runner/drive"
          mkdir -p "$mirror" .cache
          rclone sync --fast-list goal2drive: "$mirror"
          cp -R "$mirror/." .cache/
          python tools/check_goaldat.py .cache/GOAL.DAT > /dev/null && echo "GOAL.DAT verified"
      - name: goal2-archaeology (full clone; check_provenance needs its pinned commits)
        run: rm -rf "$GOAL2_ARCHAEOLOGY" && git clone -q https://github.com/diegoami/goal2-archaeology.git "$GOAL2_ARCHAEOLOGY"
      - name: Full milestone game tests and pre-merge checks (every case)
        run: |
          start=$(date +%s)
          status=0
          unset GOAL2_CASES  # Milestones always play every case, even with an inherited runner setting.
          python tools/check_premerge.py --expected-head "$(git rev-parse HEAD)" --slow 2>&1 | tee windows-slow-premerge.log || status=$?
          echo "gate wall time: $(( $(date +%s) - start )) s" | tee -a windows-slow-premerge.log
          exit $status
      - name: Keep only logs
        if: always()
        run: |
          mkdir -p upload
          cp windows-slow-premerge.log upload/ 2>/dev/null || true
          # [designed: #278] Refuse to upload anything with an original-game extension.
          if find upload -type f | grep -iE '\.(exe|dat|hlp|hil|pif|bat|sav|gl|g2save)$'; then
            echo "an original-game file reached the upload; refusing" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-slow-evidence
          path: upload
          if-no-files-found: ignore
