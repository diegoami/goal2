<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc"><title id="title">06-match-preparation</title><desc id="desc">Static proposed GOAL2 desktop layout, with numbered planning annotations. Illustrative values; no executable prototype.</desc><g font-family="DejaVu Sans, Segoe UI, sans-serif"><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#E5EAE7"/><text x="24" y="34" fill="#182D36" font-size="27" font-weight="700">06  Prepare both sides, choose Quick or Watch, then start</text><text x="24" y="61" fill="#435C62" font-size="15" font-weight="400">DESIGN PROPOSAL #253  •  Static planning artifact  •  All values illustrative; no engine output</text><rect x="24" y="86" width="1260" height="808" rx="14" fill="#F3F4ED"/><rect x="24" y="86" width="172" height="808" rx="14" fill="#14232C"/><text x="45" y="133" fill="#FFFFFF" font-size="26" font-weight="700">GOAL2</text><text x="45" y="158" fill="#BACFC8" font-size="10" font-weight="700">COUNTRY MANAGER</text><text x="47" y="202" fill="#FFFFFF" font-size="15" font-weight="400">Country desk</text><text x="47" y="257" fill="#FFFFFF" font-size="15" font-weight="400">Team</text><text x="47" y="312" fill="#FFFFFF" font-size="15" font-weight="400">Competition</text><rect x="34" y="340" width="152" height="42" rx="7" fill="#006C5B"/><text x="47" y="367" fill="#FFFFFF" font-size="15" font-weight="600">Match centre</text><text x="47" y="422" fill="#FFFFFF" font-size="15" font-weight="400">Archive</text><line x1="44" y1="735" x2="174" y2="735" stroke="#536B71"/><text x="47" y="768" fill="#FFFFFF" font-size="15" font-weight="400">Game  ▾</text><text x="47" y="797" fill="#BACFC8" font-size="14" font-weight="400">Help  F1</text><rect x="196" y="86" width="1088" height="86" rx="0" fill="#FFFFFF"/><text x="218" y="118" fill="#182D36" font-size="23" font-weight="700">Holland · A Claude</text><text x="218" y="148" fill="#435C62" font-size="14" font-weight="400">1990 · Campaign friendly · Preparation</text><rect x="990" y="105" width="270" height="38" rx="6" fill="#006C5B"/><text x="1002" y="130" fill="#FFFFFF" font-size="14" font-weight="600">Prepare next match</text><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF"/><line x1="196" y1="850" x2="1284" y2="850" stroke="#B7C6C3"/><text x="218" y="878" fill="#435C62" font-size="13" font-weight="400">Confirmed team  •  Last saved checkpoint available in Game</text><rect x="990" y="105" width="270" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="1004" y="130" fill="#006C5B" font-size="14" font-weight="600">Return to Team</text><text x="218" y="220" fill="#182D36" font-size="30" font-weight="700">Holland  v  Belgium</text><text x="218" y="252" fill="#435C62" font-size="16" font-weight="400">Scheduled friendly · Holland at home</text><text x="218" y="282" fill="#006C5B" font-size="15" font-weight="400">You manage Holland. Confirmed team; captain selected.</text><rect x="218" y="308" width="344" height="480" rx="8" fill="#FFFFFF" stroke="#B7C6C3"/><text x="234" y="338" fill="#182D36" font-size="18" font-weight="700">Holland · 4–4–2</text><text x="236" y="375" fill="#182D36" font-size="14" font-weight="400">Van Breukelen · GK</text><text x="236" y="403" fill="#182D36" font-size="14" font-weight="400">Van Aerle · RB</text><text x="236" y="431" fill="#182D36" font-size="14" font-weight="400">Van Tiggelen · CB</text><text x="236" y="459" fill="#182D36" font-size="14" font-weight="400">Koeman · SW · Captain</text><text x="236" y="487" fill="#182D36" font-size="14" font-weight="400">Fordham · LB</text><text x="236" y="515" fill="#182D36" font-size="14" font-weight="400">Wouters · MF</text><text x="236" y="543" fill="#182D36" font-size="14" font-weight="400">Rijkaard · MF</text><text x="236" y="571" fill="#182D36" font-size="14" font-weight="400">Gullit · MF</text><text x="236" y="599" fill="#182D36" font-size="14" font-weight="400">Bergkamp · MF</text><text x="236" y="627" fill="#182D36" font-size="14" font-weight="400">Van Basten · FW</text><text x="236" y="655" fill="#182D36" font-size="14" font-weight="400">Kieft · FW</text><rect x="234" y="736" width="312" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="246" y="761" fill="#182D36" font-size="14" font-weight="600">Open player / team cards</text><rect x="580" y="308" width="344" height="480" rx="8" fill="#FFFFFF" stroke="#B7C6C3"/><text x="596" y="338" fill="#182D36" font-size="18" font-weight="700">Belgium · 5–4–1</text><text x="598" y="375" fill="#182D36" font-size="14" font-weight="400">Preud’homme · GK</text><text x="598" y="403" fill="#182D36" font-size="14" font-weight="400">Albert · SW</text><text x="598" y="431" fill="#182D36" font-size="14" font-weight="400">Grun · CB</text><text x="598" y="459" fill="#182D36" font-size="14" font-weight="400">De Mol · CB</text><text x="598" y="487" fill="#182D36" font-size="14" font-weight="400">Rensburg · LB</text><text x="598" y="515" fill="#182D36" font-size="14" font-weight="400">Emmers · MF</text><text x="598" y="543" fill="#182D36" font-size="14" font-weight="400">Vandenbergh · MF</text><text x="598" y="571" fill="#182D36" font-size="14" font-weight="400">Scifo · MF</text><text x="598" y="599" fill="#182D36" font-size="14" font-weight="400">Van der Elst · MF</text><text x="598" y="627" fill="#182D36" font-size="14" font-weight="400">Claeson · FW</text><text x="598" y="655" fill="#182D36" font-size="14" font-weight="400">Wilmots · FW</text><rect x="596" y="736" width="312" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="608" y="761" fill="#182D36" font-size="14" font-weight="600">Open player / team cards</text><rect x="942" y="194" width="322" height="594" rx="8" fill="#FFFFFF" stroke="#B7C6C3"/><text x="958" y="224" fill="#182D36" font-size="18" font-weight="700">Match delivery</text><text x="960" y="260" fill="#182D36" font-size="22" font-weight="700">Quick result</text><text x="960" y="293" fill="#435C62" font-size="14" font-weight="400">Resolve without the live pitch.</text><text x="960" y="317" fill="#435C62" font-size="14" font-weight="400">Supported halftime decisions</text><text x="960" y="341" fill="#435C62" font-size="14" font-weight="400">may still require a choice.</text><rect x="960" y="383" width="286" height="38" rx="6" fill="#006C5B"/><text x="972" y="408" fill="#FFFFFF" font-size="14" font-weight="600">Start quick result</text><text x="960" y="458" fill="#182D36" font-size="22" font-weight="700">Watch match</text><text x="960" y="491" fill="#435C62" font-size="14" font-weight="400">Follow pitch and commentary.</text><text x="960" y="515" fill="#435C62" font-size="14" font-weight="400">This scheduled friendly is</text><text x="960" y="539" fill="#435C62" font-size="14" font-weight="400">available to watch.</text><text x="960" y="587" fill="#435C62" font-size="12" font-weight="600">PLAYBACK SPEED</text><rect x="960" y="601" width="286" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="972" y="626" fill="#182D36" font-size="14" font-weight="600">Slow   |   Normal ✓   |   Fast</text><rect x="960" y="666" width="286" height="38" rx="6" fill="#006C5B"/><text x="972" y="691" fill="#FFFFFF" font-size="14" font-weight="600">Start watched match</text><text x="960" y="735" fill="#435C62" font-size="12" font-weight="400">Quick and Watch use distinct routes.</text><circle cx="920" cy="330" r="13" fill="#E5BA57" stroke="#182D36"/><text x="920" y="335" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="1248" cy="215" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1248" y="220" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="1248" cy="610" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1248" y="615" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Review before kickoff</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Both named lineups and</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">formations; managed captain and</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">readiness are explicit.</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">Opponent cards stay read-only.</text><circle cx="1325" cy="355" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="360" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="359" fill="#182D36" font-size="16" font-weight="700">Actual capability decides</text><text x="1312" y="387" fill="#435C62" font-size="14" font-weight="400">This example is a supported</text><text x="1312" y="408" fill="#435C62" font-size="14" font-weight="400">friendly. A competitive fixture</text><text x="1312" y="429" fill="#435C62" font-size="14" font-weight="400">disables Watch with a reason;</text><text x="1312" y="450" fill="#435C62" font-size="14" font-weight="400">Quick and original Watch do not</text><text x="1312" y="471" fill="#435C62" font-size="14" font-weight="400">promise identical outcomes.</text><circle cx="1325" cy="628" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="633" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="632" fill="#182D36" font-size="16" font-weight="700">Speed before the match</text><text x="1312" y="660" fill="#435C62" font-size="14" font-weight="400">Retain T85 Slow/Normal/Fast and</text><text x="1312" y="681" fill="#435C62" font-size="14" font-weight="400">Normal default. Choice is</text><text x="1312" y="702" fill="#435C62" font-size="14" font-weight="400">session-local and freezes while</text><text x="1312" y="723" fill="#435C62" font-size="14" font-weight="400">busy; it controls presentation.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>