<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc"><title id="title">02-country-desk</title><desc id="desc">Static proposed GOAL2 desktop layout, with numbered planning annotations. Illustrative values; no executable prototype.</desc><g font-family="DejaVu Sans, Segoe UI, sans-serif"><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#E5EAE7" /><text x="24" y="34" fill="#182D36" font-size="27" font-weight="700">02  A country desk that makes the next decision clear</text><text x="24" y="61" fill="#435C62" font-size="15" font-weight="400">PLANNING #253 · SCENARIO A: 2030 knockout preparation; competitive Quick only · Illustrative; no engine output</text><rect x="24" y="86" width="1260" height="808" rx="14" fill="#F3F4ED" /><rect x="24" y="86" width="172" height="808" rx="14" fill="#14232C" /><text x="45" y="133" fill="#FFFFFF" font-size="26" font-weight="700">GOAL2</text><text x="45" y="158" fill="#BACFC8" font-size="10" font-weight="700">COUNTRY MANAGER</text><rect x="34" y="175" width="152" height="42" rx="7" fill="#006C5B" /><text x="47" y="202" fill="#FFFFFF" font-size="15" font-weight="600">Country desk</text><text x="47" y="257" fill="#FFFFFF" font-size="15" font-weight="400">Team</text><text x="47" y="312" fill="#FFFFFF" font-size="15" font-weight="400">Competition</text><text x="47" y="367" fill="#FFFFFF" font-size="15" font-weight="400">Match centre</text><text x="47" y="422" fill="#FFFFFF" font-size="15" font-weight="400">Archive</text><line x1="44" y1="735" x2="174" y2="735" stroke="#536B71" /><text x="47" y="768" fill="#FFFFFF" font-size="15" font-weight="400">Game  ▾</text><text x="47" y="797" fill="#BACFC8" font-size="14" font-weight="400">Help  F1</text><rect x="196" y="86" width="1088" height="86" rx="0" fill="#FFFFFF" /><text x="218" y="118" fill="#182D36" font-size="23" font-weight="700">Holland · A Claude</text><text x="218" y="148" fill="#435C62" font-size="14" font-weight="400">2030 · World Cup · Last sixteen</text><rect x="990" y="105" width="270" height="38" rx="6" fill="#006C5B" /><text x="1002" y="130" fill="#FFFFFF" font-size="14" font-weight="600">Prepare next match</text><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF" /><line x1="196" y1="850" x2="1284" y2="850" stroke="#B7C6C3" /><text x="218" y="878" fill="#435C62" font-size="13" font-weight="400">Confirmed team  •  Last saved checkpoint available in Game</text><rect x="218" y="194" width="676" height="252" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="234" y="224" fill="#182D36" font-size="18" font-weight="700">Next challenge</text><text x="238" y="273" fill="#182D36" font-size="32" font-weight="700">Holland  v  Belgium</text><text x="238" y="311" fill="#435C62" font-size="16" font-weight="400">Last sixteen  •  Italy  •  World Cup 2030</text><text x="238" y="344" fill="#182D36" font-size="15" font-weight="400">World rank 14 / 8    •    Europe rank 3 / 9</text><rect x="238" y="383" width="220" height="38" rx="6" fill="#006C5B" /><text x="250" y="408" fill="#FFFFFF" font-size="14" font-weight="600">Prepare next match</text><rect x="476" y="383" width="180" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="488" y="408" fill="#182D36" font-size="14" font-weight="600">Scout Belgium</text><rect x="912" y="194" width="352" height="252" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="928" y="224" fill="#182D36" font-size="18" font-weight="700">Your campaign</text><text x="931" y="263" fill="#182D36" font-size="20" font-weight="700">World Cup · knockout</text><text x="931" y="300" fill="#182D36" font-size="17" font-weight="400">Last sixteen</text><text x="931" y="336" fill="#006C5B" font-size="15" font-weight="400">Previous group: qualified</text><rect x="930" y="383" width="314" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="942" y="408" fill="#182D36" font-size="14" font-weight="600">Open bracket and results</text><rect x="218" y="464" width="676" height="360" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="234" y="494" fill="#182D36" font-size="18" font-weight="700">Your team · readiness</text><text x="238" y="523" fill="#435C62" font-size="12" font-weight="600">PLAYER / ROLE</text><text x="565" y="523" fill="#435C62" font-size="12" font-weight="600">READINESS</text><text x="754" y="523" fill="#435C62" font-size="12" font-weight="600">PLACE</text><line x1="238" y1="576" x2="874" y2="576" stroke="#B7C6C3" /><text x="238" y="564" fill="#182D36" font-size="15" font-weight="400">Van Breukelen · GK</text><text x="565" y="564" fill="#182D36" font-size="14" font-weight="400">Ready</text><text x="754" y="564" fill="#182D36" font-size="14" font-weight="400">XI</text><line x1="238" y1="621" x2="874" y2="621" stroke="#B7C6C3" /><text x="238" y="609" fill="#182D36" font-size="15" font-weight="400">Koeman · Sweeper</text><text x="565" y="609" fill="#182D36" font-size="14" font-weight="400">Ready</text><text x="754" y="609" fill="#182D36" font-size="14" font-weight="400">XI · C</text><line x1="238" y1="666" x2="874" y2="666" stroke="#B7C6C3" /><text x="238" y="654" fill="#182D36" font-size="15" font-weight="400">Wouters · Midfield</text><text x="565" y="654" fill="#182D36" font-size="14" font-weight="400">Ready</text><text x="754" y="654" fill="#182D36" font-size="14" font-weight="400">Bench</text><line x1="238" y1="711" x2="874" y2="711" stroke="#B7C6C3" /><text x="238" y="699" fill="#182D36" font-size="15" font-weight="400">Bergkamp · Midfield</text><text x="565" y="699" fill="#182D36" font-size="14" font-weight="400">Ready</text><text x="754" y="699" fill="#182D36" font-size="14" font-weight="400">XI</text><rect x="238" y="770" width="238" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="250" y="795" fill="#182D36" font-size="14" font-weight="600">Review your team</text><text x="506" y="795" fill="#006C5B" font-size="14" font-weight="400">XI 11/11  ·  Bench 9</text><rect x="912" y="464" width="352" height="360" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="928" y="494" fill="#182D36" font-size="18" font-weight="700">Soccer bulletin</text><text x="932" y="526" fill="#182D36" font-size="19" font-weight="700">The next national chapter</text><text x="932" y="562" fill="#435C62" font-size="14" font-weight="400">Campaign news and consequences</text><text x="932" y="588" fill="#435C62" font-size="14" font-weight="400">sit beside the next fixture.</text><text x="932" y="614" fill="#435C62" font-size="14" font-weight="400">Affected players link to Team;</text><text x="932" y="640" fill="#435C62" font-size="14" font-weight="400">tables and winners link to</text><text x="932" y="666" fill="#435C62" font-size="14" font-weight="400">Competition or Country records.</text><rect x="931" y="770" width="314" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="943" y="795" fill="#182D36" font-size="14" font-weight="600">Read news / last result</text><circle cx="1249" cy="118" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1249" y="123" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="874" cy="485" r="13" fill="#E5BA57" stroke="#182D36" /><text x="874" y="490" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="1247" cy="486" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1247" y="491" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">One next-match route</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Prepare never simulates. It</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">opens lineups, captain,</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">Quick/Watch and speed;</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">unsupported calendar boundaries</text><text x="1312" y="235" fill="#435C62" font-size="14" font-weight="400">state a reason.</text><circle cx="1325" cy="350" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="355" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="354" fill="#182D36" font-size="16" font-weight="700">Manage people in context</text><text x="1312" y="382" fill="#435C62" font-size="14" font-weight="400">XI, bench and readiness remain</text><text x="1312" y="403" fill="#435C62" font-size="14" font-weight="400">visible. A problem takes you to</text><text x="1312" y="424" fill="#435C62" font-size="14" font-weight="400">the affected player with full</text><text x="1312" y="445" fill="#435C62" font-size="14" font-weight="400">card and draft preserved.</text><circle cx="1325" cy="575" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="580" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="579" fill="#182D36" font-size="16" font-weight="700">A country, over years</text><text x="1312" y="607" fill="#435C62" font-size="14" font-weight="400">Retain national ranks,</text><text x="1312" y="628" fill="#435C62" font-size="14" font-weight="400">opponent, competition and news.</text><text x="1312" y="649" fill="#435C62" font-size="14" font-weight="400">Country records and round</text><text x="1312" y="670" fill="#435C62" font-size="14" font-weight="400">results make each match</text><text x="1312" y="691" fill="#435C62" font-size="14" font-weight="400">consequential.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>