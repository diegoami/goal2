<text x="1190" y="606" fill="#435C62" font-size="15" font-weight="400">—</text><text x="640" y="638" fill="#182D36" font-size="14" font-weight="400">Red cards</text><text x="997" y="638" fill="#435C62" font-size="15" font-weight="400">—</text><text x="1190" y="638" fill="#435C62" font-size="15" font-weight="400">—</text><text x="640" y="670" fill="#182D36" font-size="14" font-weight="400">Possession</text><text x="997" y="670" fill="#435C62" font-size="15" font-weight="400">—</text><text x="1190" y="670" fill="#435C62" font-size="15" font-weight="400">—</text><text x="640" y="702" fill="#182D36" font-size="14" font-weight="400">Territory</text><text x="997" y="702" fill="#435C62" font-size="15" font-weight="400">—</text><text x="1190" y="702" fill="#435C62" font-size="15" font-weight="400">—</text><text x="640" y="797" fill="#435C62" font-size="12" font-weight="400">Dashes are illustrative; actual unknowns say Not recorded.</text><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF"/><rect x="218" y="853" width="189" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="230" y="878" fill="#182D36" font-size="14" font-weight="600">Round results</text><rect x="424" y="853" width="211" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="436" y="878" fill="#182D36" font-size="14" font-weight="600">Open retained summary</text><rect x="1000" y="853" width="264" height="38" rx="6" fill="#006C5B"/><text x="1012" y="878" fill="#FFFFFF" font-size="14" font-weight="600">Continue campaign</text><circle cx="1248" cy="209" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1248" y="214" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="1248" cy="342" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1248" y="347" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="981" cy="871" r="13" fill="#E5BA57" stroke="#182D36"/><text x="981" y="876" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Understand resolution</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Normal goals and penalty kicks</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">stay separate. Scorers/minutes,</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">half-time, match stages and</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">outcome explain what happened.</text><circle cx="1325" cy="342" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="347" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="346" fill="#182D36" font-size="16" font-weight="700">No information dropped</text><text x="1312" y="374" fill="#435C62" font-size="14" font-weight="400">All original comparison</text><text x="1312" y="395" fill="#435C62" font-size="14" font-weight="400">statistics remain. Source route</text><text x="1312" y="416" fill="#435C62" font-size="14" font-weight="400">and missing retention are</text><text x="1312" y="437" fill="#435C62" font-size="14" font-weight="400">explicit; result schema is</text><text x="1312" y="458" fill="#435C62" font-size="14" font-weight="400">shared with Archive.</text><circle cx="1325" cy="582" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="587" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="586" fill="#182D36" font-size="16" font-weight="700">A campaign, not a dead end</text><text x="1312" y="614" fill="#435C62" font-size="14" font-weight="400">Continue returns to next</text><text x="1312" y="635" fill="#435C62" font-size="14" font-weight="400">fixture/readiness/news. Wider</text><text x="1312" y="656" fill="#435C62" font-size="14" font-weight="400">round and country records</text><text x="1312" y="677" fill="#435C62" font-size="14" font-weight="400">remain discoverable. Replay</text><text x="1312" y="698" fill="#435C62" font-size="14" font-weight="400">needs actual durable recording.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>