<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Segoe UI, sans-serif"><title id="title">08-result-and-campaign</title><desc id="desc">Static proposed GOAL2 desktop layout, with numbered planning annotations. Illustrative values; no executable prototype.</desc><g font-family="DejaVu Sans, Segoe UI, sans-serif"><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#E5EAE7" /><text x="24" y="34" fill="#182D36" font-size="27" font-weight="700">08  Explain the result, keep it, and return to the country</text><text x="24" y="61" fill="#435C62" font-size="15" font-weight="400">PLANNING #253 · SCENARIO C: 2030 knockout result; separate from friendly B · Illustrative; no engine output</text><rect x="24" y="86" width="1260" height="808" rx="14" fill="#F3F4ED" /><rect x="24" y="86" width="172" height="808" rx="14" fill="#14232C" /><text x="45" y="133" fill="#FFFFFF" font-size="26" font-weight="700">GOAL2</text><text x="45" y="158" fill="#BACFC8" font-size="10" font-weight="700">COUNTRY MANAGER</text><text x="47" y="202" fill="#FFFFFF" font-size="15" font-weight="400">Country desk</text><text x="47" y="257" fill="#FFFFFF" font-size="15" font-weight="400">Team</text><text x="47" y="312" fill="#FFFFFF" font-size="15" font-weight="400">Competition</text><rect x="34" y="340" width="152" height="42" rx="7" fill="#006C5B" /><text x="47" y="367" fill="#FFFFFF" font-size="15" font-weight="600">Match centre</text><text x="47" y="422" fill="#FFFFFF" font-size="15" font-weight="400">Archive</text><line x1="44" y1="735" x2="174" y2="735" stroke="#536B71" /><text x="47" y="768" fill="#FFFFFF" font-size="15" font-weight="400">Game  ▾</text><text x="47" y="797" fill="#BACFC8" font-size="14" font-weight="400">Help  F1</text><rect x="196" y="86" width="1088" height="86" rx="0" fill="#FFFFFF" /><text x="218" y="118" fill="#182D36" font-size="23" font-weight="700">Holland · A Claude</text><text x="218" y="148" fill="#435C62" font-size="14" font-weight="400">World Cup · Last sixteen · Result</text><rect x="990" y="105" width="270" height="38" rx="6" fill="#006C5B" /><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF" /><line x1="196" y1="850" x2="1284" y2="850" stroke="#B7C6C3" /><rect x="990" y="105" width="270" height="38" rx="6" fill="#E0E8E4" /><text x="1004" y="130" fill="#435C62" font-size="13" font-weight="400">Result ready · Continue below</text><text x="218" y="230" fill="#182D36" font-size="33" font-weight="700">Holland  2 — 2  Belgium</text><text x="218" y="266" fill="#006C5B" font-size="17" font-weight="600">After extra time · Holland wins on penalties</text><text x="218" y="296" fill="#435C62" font-size="14" font-weight="400">HT 1–1   ·   Regulation 2–2   ·   Extra time 2–2   ·   Penalties 6–5</text><rect x="218" y="322" width="480" height="501" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="234" y="352" fill="#182D36" font-size="18" font-weight="700">Scorers and match story</text><text x="236" y="382" fill="#006C5B" font-size="17" font-weight="700">Holland</text><text x="473" y="382" fill="#006C5B" font-size="17" font-weight="700">Belgium</text><text x="236" y="426" fill="#182D36" font-size="15" font-weight="400">Bergkamp 31′</text><text x="473" y="426" fill="#182D36" font-size="15" font-weight="400">Scifo 12′</text><text x="236" y="464" fill="#182D36" font-size="15" font-weight="400">Van Basten 76′</text><text x="473" y="464" fill="#182D36" font-size="15" font-weight="400">Wilmots 81′</text><line x1="236" y1="501" x2="680" y2="501" stroke="#B7C6C3" /><text x="236" y="542" fill="#182D36" font-size="17" font-weight="700">Man of the match · Bergkamp</text><text x="236" y="592" fill="#435C62" font-size="14" font-weight="400">Scorer minutes, half-time and match stages</text><text x="236" y="623" fill="#435C62" font-size="14" font-weight="400">tell the story beyond the final score.</text><text x="236" y="654" fill="#435C62" font-size="14" font-weight="400" /><text x="236" y="685" fill="#435C62" font-size="14" font-weight="400">Retained summary uses the same layout.</text><text x="236" y="716" fill="#435C62" font-size="14" font-weight="400">A missing field says Not recorded.</text><text x="236" y="747" fill="#435C62" font-size="14" font-weight="400">Round results show the wider competition.</text><rect x="716" y="322" width="548" height="501" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="732" y="352" fill="#182D36" font-size="18" font-weight="700">Statistics</text><text x="731" y="380" fill="#435C62" font-size="12" font-weight="600">MEASURE</text><text x="989" y="380" fill="#435C62" font-size="12" font-weight="600">HOLLAND</text><text x="1111" y="380" fill="#435C62" font-size="12" font-weight="600">BELGIUM</text><line x1="731" y1="424" x2="1246" y2="424" stroke="#B7C6C3" /><text x="731" y="415" fill="#182D36" font-size="14" font-weight="400">Corners</text><text x="989" y="415" fill="#182D36" font-size="15" font-weight="400">4</text><text x="1111" y="415" fill="#182D36" font-size="15" font-weight="400">3</text><line x1="731" y1="455" x2="1246" y2="455" stroke="#B7C6C3" /><text x="731" y="446" fill="#182D36" font-size="14" font-weight="400">Free kicks</text><text x="989" y="446" fill="#182D36" font-size="15" font-weight="400">8</text><text x="1111" y="446" fill="#182D36" font-size="15" font-weight="400">10</text><line x1="731" y1="486" x2="1246" y2="486" stroke="#B7C6C3" /><text x="731" y="477" fill="#182D36" font-size="14" font-weight="400">Penalties</text><text x="989" y="477" fill="#182D36" font-size="15" font-weight="400">0</text><text x="1111" y="477" fill="#182D36" font-size="15" font-weight="400">0</text><line x1="731" y1="517" x2="1246" y2="517" stroke="#B7C6C3" /><text x="731" y="508" fill="#182D36" font-size="14" font-weight="400">Shots</text><text x="989" y="508" fill="#182D36" font-size="15" font-weight="400">12</text><text x="1111" y="508" fill="#182D36" font-size="15" font-weight="400">9</text><line x1="731" y1="548" x2="1246" y2="548" stroke="#B7C6C3" /><text x="731" y="539" fill="#182D36" font-size="14" font-weight="400">On target</text><text x="989" y="539" fill="#182D36" font-size="15" font-weight="400">6</text><text x="1111" y="539" fill="#182D36" font-size="15" font-weight="400">5</text><line x1="731" y1="579" x2="1246" y2="579" stroke="#B7C6C3" /><text x="731" y="570" fill="#182D36" font-size="14" font-weight="400">Saves</text><text x="989" y="570" fill="#182D36" font-size="15" font-weight="400">3</text><text x="1111" y="570" fill="#182D36" font-size="15" font-weight="400">4</text><line x1="731" y1="610" x2="1246" y2="610" stroke="#B7C6C3" /><text x="731" y="601" fill="#182D36" font-size="14" font-weight="400">Fouls</text><text x="989" y="601" fill="#182D36" font-size="15" font-weight="400">10</text><text x="1111" y="601" fill="#182D36" font-size="15" font-weight="400">8</text><line x1="731" y1="641" x2="1246" y2="641" stroke="#B7C6C3" /><text x="731" y="632" fill="#182D36" font-size="14" font-weight="400">Yellow cards</text><text x="989" y="632" fill="#182D36" font-size="15" font-weight="400">1</text><text x="1111" y="632" fill="#182D36" font-size="15" font-weight="400">2</text><line x1="731" y1="672" x2="1246" y2="672" stroke="#B7C6C3" /><text x="731" y="663" fill="#182D36" font-size="14" font-weight="400">Red cards</text><text x="989" y="663" fill="#182D36" font-size="15" font-weight="400">0</text><text x="1111" y="663" fill="#182D36" font-size="15" font-weight="400">0</text><line x1="731" y1="703" x2="1246" y2="703" stroke="#B7C6C3" /><text x="731" y="694" fill="#182D36" font-size="14" font-weight="400">Possession</text><text x="989" y="694" fill="#182D36" font-size="12" font-weight="400">Not recorded</text><text x="1111" y="694" fill="#182D36" font-size="12" font-weight="400">Not recorded</text><line x1="731" y1="734" x2="1246" y2="734" stroke="#B7C6C3" /><text x="731" y="725" fill="#182D36" font-size="14" font-weight="400">Territory</text><text x="989" y="725" fill="#182D36" font-size="12" font-weight="400">Not recorded</text><text x="1111" y="725" fill="#182D36" font-size="12" font-weight="400">Not recorded</text><text x="731" y="797" fill="#435C62" font-size="12" font-weight="400">Illustrative values; source measures retain their units.</text><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF" /><rect x="218" y="853" width="189" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="230" y="878" fill="#182D36" font-size="14" font-weight="600">Round results</text><rect x="424" y="853" width="211" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="436" y="878" fill="#182D36" font-size="14" font-weight="600">Retained summary</text><rect x="1000" y="853" width="264" height="38" rx="6" fill="#006C5B" /><text x="1012" y="878" fill="#FFFFFF" font-size="14" font-weight="600">Continue campaign</text><circle cx="1248" cy="209" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1248" y="214" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="1248" cy="342" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1248" y="347" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="981" cy="871" r="13" fill="#E5BA57" stroke="#182D36" /><text x="981" y="876" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Understand resolution</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Normal goals and penalty kicks</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">stay separate. Scorers/minutes,</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">half-time, match stages and</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">outcome explain the result.</text><circle cx="1325" cy="342" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="347" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="346" fill="#182D36" font-size="16" font-weight="700">No information dropped</text><text x="1312" y="374" fill="#435C62" font-size="14" font-weight="400">All original comparison</text><text x="1312" y="395" fill="#435C62" font-size="14" font-weight="400">categories remain. Missing data</text><text x="1312" y="416" fill="#435C62" font-size="14" font-weight="400">is visibly different from zero;</text><text x="1312" y="437" fill="#435C62" font-size="14" font-weight="400">result and archive use the same</text><text x="1312" y="458" fill="#435C62" font-size="14" font-weight="400">schema.</text><circle cx="1325" cy="582" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="587" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="586" fill="#182D36" font-size="16" font-weight="700">A campaign, not a dead end</text><text x="1312" y="614" fill="#435C62" font-size="14" font-weight="400">Continue returns to next</text><text x="1312" y="635" fill="#435C62" font-size="14" font-weight="400">fixture/readiness/news. Wider</text><text x="1312" y="656" fill="#435C62" font-size="14" font-weight="400">round and country records</text><text x="1312" y="677" fill="#435C62" font-size="14" font-weight="400">remain discoverable. Replay</text><text x="1312" y="698" fill="#435C62" font-size="14" font-weight="400">needs durable recording.</text><text x="24" y="934" fill="#435C62" font-size="14" font-weight="600">FULL-PARITY TARGET · retained fields when available; new summary capture/replay/export remain G04.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>
