<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc"><title id="title">08-result-and-campaign</title><desc id="desc">Static proposed GOAL2 desktop layout, with numbered planning annotations. Illustrative values; no executable prototype.</desc><g font-family="DejaVu Sans, Segoe UI, sans-serif"><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#E5EAE7"/><text x="24" y="34" fill="#182D36" font-size="27" font-weight="700">08  Explain the result, keep it, and return to the country</text><text x="24" y="61" fill="#435C62" font-size="15" font-weight="400">DESIGN PROPOSAL #253  •  Static planning artifact  •  All values illustrative; no engine output</text><rect x="24" y="86" width="1260" height="808" rx="14" fill="#F3F4ED"/><rect x="24" y="86" width="172" height="808" rx="14" fill="#14232C"/><text x="45" y="133" fill="#FFFFFF" font-size="26" font-weight="700">GOAL2</text><text x="45" y="158" fill="#BACFC8" font-size="10" font-weight="700">COUNTRY MANAGER</text><text x="47" y="202" fill="#FFFFFF" font-size="15" font-weight="400">Country desk</text><text x="47" y="257" fill="#FFFFFF" font-size="15" font-weight="400">Team</text><text x="47" y="312" fill="#FFFFFF" font-size="15" font-weight="400">Competition</text><rect x="34" y="340" width="152" height="42" rx="7" fill="#006C5B"/><text x="47" y="367" fill="#FFFFFF" font-size="15" font-weight="600">Match centre</text><text x="47" y="422" fill="#FFFFFF" font-size="15" font-weight="400">Archive</text><line x1="44" y1="735" x2="174" y2="735" stroke="#536B71"/><text x="47" y="768" fill="#FFFFFF" font-size="15" font-weight="400">Game  ▾</text><text x="47" y="797" fill="#BACFC8" font-size="14" font-weight="400">Help  F1</text><rect x="196" y="86" width="1088" height="86" rx="0" fill="#FFFFFF"/><text x="218" y="118" fill="#182D36" font-size="23" font-weight="700">Holland · A Claude</text><text x="218" y="148" fill="#435C62" font-size="14" font-weigh