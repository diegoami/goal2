ext x="990" y="392" fill="#182D36" font-size="13" font-weight="400">31′   Goal — Holland</text><text x="990" y="435" fill="#182D36" font-size="13" font-weight="400">        Scorer and event context</text><text x="990" y="478" fill="#182D36" font-size="13" font-weight="400">28′   Passing move continues</text><text x="990" y="521" fill="#182D36" font-size="13" font-weight="400">…</text><text x="990" y="564" fill="#006C5B" font-size="13" font-weight="400">Follow live ✓</text><text x="218" y="676" fill="#435C62" font-size="13" font-weight="400">○ Holland   ◇ Belgium   ● Ball  •  Slot labels and selected-player legend</text><rect x="218" y="697" width="1046" height="126" rx="8" fill="#FFFFFF" stroke="#B7C6C3"/><text x="234" y="727" fill="#182D36" font-size="18" font-weight="700">Live actions</text><rect x="236" y="751" width="206" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="248" y="776" fill="#182D36" font-size="14" font-weight="600">Manage team</text><rect x="458" y="751" width="187" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="470" y="776" fill="#182D36" font-size="14" font-weight="600">Commentary</text><rect x="661" y="751" width="225" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="673" y="776" fill="#182D36" font-size="14" font-weight="600">Normal · locked for job</text><rect x="902" y="751" width="344" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="914" y="776" fill="#182D36" font-size="14" font-weight="600">Finish quickly · supported stops</text><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF"/><text x="218" y="878" fill="#435C62" font-size="13" font-weight="400">Watching  •  Team changes available only at supported decision boundaries</text><circle cx="1248" cy="115" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1248" y="120" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="1248" cy="216" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1248" y="221" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="1248" cy="715" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1248" y="720" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">One match identity</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Score, authoritative clock and</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">phase never scroll away. No new</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">inferred engine time,</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">interpolated position or</text><text x="1312" y="235" fill="#435C62" font-size="14" font-weight="400">physical-pitch claim.</text><circle cx="1325" cy="346" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="351" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="350" fill="#182D36" font-size="16" font-weight="700">Tension and explanation</text><text x="1312" y="378" fill="#435C62" font-size="14" font-weight="400">Pitch and latest event stay</text><text x="1312" y="399" fill="#435C62" font-size="14" font-weight="400">together. Commentary can review</text><text x="1312" y="420" fill="#435C62" font-size="14" font-weight="400">history while a visible Follow</text><text x="1312" y="441" fill="#435C62" font-size="14" font-weight="400">live restores the tail.</text><circle cx="1325" cy="585" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="590" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="589" fill="#182D36" font-size="16" font-weight="700">Discoverable control</text><text x="1312" y="617" fill="#435C62" font-size="14" font-weight="400">Manage team states the</text><text x="1312" y="638" fill="#435C62" font-size="14" font-weight="400">supported boundary. No disabled</text><text x="1312" y="659" fill="#435C62" font-size="14" font-weight="400">mystery bench, mid-match save</text><text x="1312" y="680" fill="#435C62" font-size="14" font-weight="400">promise or control that</text><text x="1312" y="701" fill="#435C62" font-size="14" font-weight="400">silently does nothing.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>