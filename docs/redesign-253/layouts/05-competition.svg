D36" font-size="14" font-weight="600">View whole-round fixtures</text><rect x="1000" y="765" width="246" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3"/><text x="1012" y="790" fill="#182D36" font-size="14" font-weight="600">Back to preparation</text><circle cx="720" cy="262" r="13" fill="#E5BA57" stroke="#182D36"/><text x="720" y="267" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="1250" cy="262" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1250" y="267" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="1250" cy="658" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1250" y="663" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Table and purpose</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Keep all original table</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">categories. Current GD/Pts</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">additions are labelled</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">separately. Qualification stays</text><text x="1312" y="235" fill="#435C62" font-size="14" font-weight="400">provisional until actual rules</text><text x="1312" y="256" fill="#435C62" font-size="14" font-weight="400">resolve.</text><circle cx="1325" cy="358" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="363" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="362" fill="#182D36" font-size="16" font-weight="700">Context alongside rank</text><text x="1312" y="390" fill="#435C62" font-size="14" font-weight="400">The selected group changes both</text><text x="1312" y="411" fill="#435C62" font-size="14" font-weight="400">table and adjacent matches.</text><text x="1312" y="432" fill="#435C62" font-size="14" font-weight="400">Year, competition, group and</text><text x="1312" y="453" fill="#435C62" font-size="14" font-weight="400">continent stay visible.</text><circle cx="1325" cy="584" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="589" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="588" fill="#182D36" font-size="16" font-weight="700">Scope follows data</text><text x="1312" y="616" fill="#435C62" font-size="14" font-weight="400">Original watch flags and</text><text x="1312" y="637" fill="#435C62" font-size="14" font-weight="400">rearrangements need supported</text><text x="1312" y="658" fill="#435C62" font-size="14" font-weight="400">scheduling. Existing</text><text x="1312" y="679" fill="#435C62" font-size="14" font-weight="400">competition tasks own</text><text x="1312" y="700" fill="#435C62" font-size="14" font-weight="400">progression; UI browsing cannot</text><text x="1312" y="721" fill="#435C62" font-size="14" font-weight="400">create fixtures.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>