6" font-size="16" font-weight="700">Selection ≠ membership</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Arrows select a player; Space</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">or the explicit XI action</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">changes membership. Existing7</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">compact columns and38/37</text><text x="1312" y="235" fill="#435C62" font-size="14" font-weight="400">expanded contract survive.</text><circle cx="1325" cy="322" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="327" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="326" fill="#182D36" font-size="16" font-weight="700">All original categories</text><text x="1312" y="354" fill="#435C62" font-size="14" font-weight="400">All12 skills and5</text><text x="1312" y="375" fill="#435C62" font-size="14" font-weight="400">characteristics remain</text><text x="1312" y="396" fill="#435C62" font-size="14" font-weight="400">together. Identity, both roles,</text><text x="1312" y="417" fill="#435C62" font-size="14" font-weight="400">condition, discipline and</text><text x="1312" y="438" fill="#435C62" font-size="14" font-weight="400">personal tactics stay in the</text><text x="1312" y="459" fill="#435C62" font-size="14" font-weight="400">card.</text><circle cx="1325" cy="544" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="549" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="548" fill="#182D36" font-size="16" font-weight="700">A readable national plan</text><text x="1312" y="576" fill="#435C62" font-size="14" font-weight="400">Formation is an evidenced</text><text x="1312" y="597" fill="#435C62" font-size="14" font-weight="400">summary, not guessed geometry.</text><text x="1312" y="618" fill="#435C62" font-size="14" font-weight="400">Captain, XI and bench sit with</text><text x="1312" y="639" fill="#435C62" font-size="14" font-weight="400">team decisions; instructions</text><text x="1312" y="660" fill="#435C62" font-size="14" font-weight="400">keep8 named values.</text><circle cx="1325" cy="763" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="768" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="1347" y="767" fill="#182D36" font-size="16" font-weight="700">Explicit draft boundary</text><text x="1312" y="795" fill="#435C62" font-size="14" font-weight="400">Confirm validates supported</text><text x="1312" y="816" fill="#435C62" font-size="14" font-weight="400">choices. Navigation preserves</text><text x="1312" y="837" fill="#435C62" font-size="14" font-weight="400">drafts. A failed field stays</text><text x="1312" y="858" fill="#435C62" font-size="14" font-weight="400">visible; Save does not silently</text><text x="1312" y="879" fill="#435C62" font-size="14" font-weight="400">commit a draft.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>