<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc"><title id="title">10-match-decisions</title><desc id="desc">Static proposed GOAL2 desktop layout, with numbered planning annotations. Illustrative values; no executable prototype.</desc><g font-family="DejaVu Sans, Segoe UI, sans-serif"><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#E5EAE7"/><text x="24" y="34" fill="#182D36" font-size="27" font-weight="700">10  Conditional decisions keep score, phase and the next action visible</text><text x="24" y="61" fill="#435C62" font-size="15" font-weight="400">DESIGN PROPOSAL #253  •  Static planning artifact  •  All values illustrative; no engine output</text><rect x="24" y="86" width="1260" height="808" rx="14" fill="#F3F4ED"/><rect x="24" y="86" width="172" height="808" rx="14" fill="#14232C"/><text x="45" y="133" fill="#FFFFFF" font-size="26" font-weight="700">GOAL2</text><text x="45" y="158" fill="#BACFC8" font-size="10" font-weight="700">COUNTRY MANAGER</text><text x="47" y="202" fill="#FFFFFF" font-size="15" font-weight="400">Country desk</text><text x="47" y="257" fill="#FFFFFF" font-size="15" font-weight="400">Team</text><text x="47" y="312" fill="#FFFFFF" font-size="15" font-weight="400">Competition</text><rect x="34" y="340" width="152" height="42" rx="7" fill="#006C5B"/><text x="47" y="367" fill="#FFFFFF" font-size="15" font-weight="600">Match centre</text><text x="47" y="422" fill="#FFFFFF" font-size="15" font-weight="400">Archive</text><line x1="44" y1="735" x2="174" y2="735" stroke="#536B71"/><text x="47" y="768" fill="#FFFFFF" font-size="15" font-weight="400">Game  ▾</text><text x="47" y="797" fill="#BACFC8" font-size="14" font-weight="400">Help  F1</text><rect x="196" y="86" width="1088" height="86" rx="0" fill="#FFFFFF"/><text x="218" y="118" fill="#182D36" font-size="23" font-weight="700">Holland · A Claude</text><text x="218" y="148" fill="#435C62" font-size="14" font-weight="400">Decision examples · capability-dependent, not a working prototype</text><rect x="990" y="105" width="270" height="38" rx="6" fill="#006C5B"/><text x="1002" y="130" fill="#FFFFFF" font-size="14" font-weight="600">Prepare next match</text><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF"/><line x1="196" y1="850" x2="1284" y2="850" stroke="#B7C6C3"/><text x="218" y="878" fill="#435C62" font-size="13" font-weight="400">Confirmed team  •  Last saved checkpoint available in Game</text><rect x="990" y="105" width="270" height="38" rx="6" fill="#E0E8E4"/><text x="1004" y="130" fill="#435C62" font-size="13" font-weight="400">Match in progress · decision</text><rect x="196" y="850" width="1088" height="44" rx="0" fill="#FFFFFF"/><text x="218" y="878" fill="#435C62" font-size="13" font-weight="400">Match is paused at the current supported decision · Resume explicitly</text><rect x="218" y="194" width="1046" height="620" rx="8" fill="#FFFFFF" stroke="#B7C6C3"/><text x="234" y="224" fill="#182D36" font-size="18" font-weight="700">Decision panel in the match centre</text><rect x="236" y="253" width="318" height="504" rx="7" fill="#F3F4ED" stroke="#B7C6C3"/><text x="250" y="286" fill="#006C5B" font-size="18" font-weight="700">HALF-TIME</text><text x="250" y="314" fill="#182D36" font-size="12" font-weight="400">45′ · Holland 1–1 Belgium</text><text x="250" y="362" fill="#182D36" font-size="12" font-weight="400">Changes remaining: 2</text><text x="250" y="405" fill="#182D36" font-size="12" font-weight="400">Off: Koeman · Energy 16 · Ready</text><text x="250" y="448" fill="#182D36" font-size="12" font-weight="400">On: Wouters · Energy 29 · Ready</text><text x="250" y="491" fill="#182D36" font-size="12" font-weight="400">Compare complete player cards</text><text x="250" y="534" fill="#182D36" font-size="12" font-weight="400">Confirm substitution / Cancel</text><text x="250" y="577" fill="#182D36" font-size="12" font-weight="400">Review team / player instructions</text><rect x="250" y="699" width="290" height="38" rx="6" fill="#006C5B"/><text x="262" y="724" fill="#FFFFFF" font-size="14" font-weight="600">Start second half</text><rect x="580" y="253" width="318" height="504" rx="7" fill="#F3F4ED" stroke="#B7C6C3"/><text x="594" y="286" fill="#006C5B" font-size="18" font-weight="700">EXTRA TIME</text><text x="594" y="314" fill="#182D36" font-size="12" font-weight="400">Regulation complete · 2–2</text><text x="594" y="362" fill="#182D36" font-size="12" font-weight="400">The match is level after regulation</text><text x="594" y="405" fill="#182D36" font-size="12" font-weight="400">Review bench and team plan</text><text x="594" y="448" fill="#182D36" font-size="12" font-weight="400">Start extra time when ready</text><text x="594" y="491" fill="#182D36" font-size="12" font-weight="400">Half-time appears at its midpoint</text><text x="594" y="534" fill="#182D36" font-size="12" font-weight="400">Resume extra time when ready</text><rect x="594" y="699" width="290" height="38" rx="6" fill="#006C5B"/><text x="606" y="724" fill="#FFFFFF" font-size="14" font-weight="600">Start / resume extra time</text><rect x="924" y="253" width="318" height="504" rx="7" fill="#F3F4ED" stroke="#B7C6C3"/><text x="938" y="286" fill="#006C5B" font-size="18" font-weight="700">SHOOT-OUT</text><text x="938" y="314" fill="#182D36" font-size="12" font-weight="400">After extra time · level</text><text x="938" y="362" fill="#182D36" font-size="12" font-weight="400">1 Van Basten · 2 Bergkamp</text><text x="938" y="405" fill="#182D36" font-size="12" font-weight="400">3 Koeman · 4 Gullit</text><text x="938" y="448" fill="#182D36" font-size="12" font-weight="400">5 Rijkaard · … · 11 Van Breukelen</text><text x="938" y="491" fill="#182D36" font-size="12" font-weight="400">Selected card: Penalties 21 / Energy 8</text><text x="938" y="534" fill="#182D36" font-size="12" font-weight="400">Undo pick · Review entire order</text><text x="938" y="577" fill="#182D36" font-size="12" font-weight="400">Next: taker, kick outcome and score</text><rect x="938" y="699" width="290" height="38" rx="6" fill="#006C5B"/><text x="950" y="724" fill="#FFFFFF" font-size="14" font-weight="600">Confirm taker order</text><text x="236" y="792" fill="#435C62" font-size="13" font-weight="400">Injury, taker and replay choices use a focused panel. A blocked change explains why and keeps the lineup.</text><circle cx="1250" cy="214" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1250" y="219" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="541" cy="272" r="13" fill="#E5BA57" stroke="#182D36"/><text x="541" y="277" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="1245" cy="707" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1245" y="712" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Automatic boundary</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">The runtime enters each phase;</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">the player commits/resumes.</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">Opening a pane, scrolling or</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">dismissing a notice cannot</text><text x="1312" y="235" fill="#435C62" font-size="14" font-weight="400">resume play.</text><circle cx="1325" cy="361" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="366" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="365" fill="#182D36" font-size="16" font-weight="700">Supported intervention</text><text x="1312" y="393" fill="#435C62" font-size="14" font-weight="400">Cards, selected identities and</text><text x="1312" y="414" fill="#435C62" font-size="14" font-weight="400">remaining count are visible.</text><text x="1312" y="435" fill="#435C62" font-size="14" font-weight="400">Rejection preserves the lineup;</text><text x="1312" y="456" fill="#435C62" font-size="14" font-weight="400">no-substitutions-left remains</text><text x="1312" y="477" fill="#435C62" font-size="14" font-weight="400">an evidence/support gap.</text><circle cx="1325" cy="630" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="635" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="634" fill="#182D36" font-size="16" font-weight="700">Conditional ≠ available</text><text x="1312" y="662" fill="#435C62" font-size="14" font-weight="400">Original prompt and order</text><text x="1312" y="683" fill="#435C62" font-size="14" font-weight="400">evidence is preserved. #250</text><text x="1312" y="704" fill="#435C62" font-size="14" font-weight="400">must establish worker</text><text x="1312" y="725" fill="#435C62" font-size="14" font-weight="400">pause/answer/resume.</text><text x="1312" y="746" fill="#435C62" font-size="14" font-weight="400">Timers/defaults appear only</text><text x="1312" y="767" fill="#435C62" font-size="14" font-weight="400">when runtime-enforced.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>