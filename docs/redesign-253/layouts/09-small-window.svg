<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc"><title id="title">09-small-window</title><desc id="desc">Static proposed GOAL2 desktop layout, with numbered planning annotations. Illustrative values; no executable prototype.</desc><g font-family="DejaVu Sans, Segoe UI, sans-serif"><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#E5EAE7" /><text x="24" y="34" fill="#182D36" font-size="27" font-weight="700">09  A readable full card and an explicit route to the rest of the squad</text><text x="24" y="61" fill="#435C62" font-size="15" font-weight="400">PLANNING #253 · SCENARIO A: same Team draft at 900×640; explicit roster scroll · Illustrative; no engine output</text><rect x="24" y="86" width="900" height="640" rx="8" fill="#F3F4ED" /><rect x="24" y="86" width="900" height="64" rx="0" fill="#14232C" /><text x="42" y="113" fill="#FFFFFF" font-size="19" font-weight="700">Holland · Team</text><text x="42" y="137" fill="#FFFFFF" font-size="13" font-weight="400">2030 · Scenario A · unconfirmed draft</text><rect x="694" y="100" width="214" height="38" rx="6" fill="#006C5B" /><text x="706" y="125" fill="#FFFFFF" font-size="14" font-weight="600">Prepare next match</text><rect x="24" y="150" width="900" height="44" rx="0" fill="#FFFFFF" /><text x="42" y="178" fill="#182D36" font-size="14" font-weight="400">Country desk  |  Team  |  Competition  |  Match centre  |  Archive  |  Game</text><rect x="40" y="210" width="304" height="449" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="56" y="240" fill="#182D36" font-size="18" font-weight="700">Squad 20 · XI 11 / Bench 9</text><text x="54" y="268" fill="#435C62" font-size="12" font-weight="400">Rows 1–8 · selected Koeman</text><text x="55" y="300" fill="#182D36" font-size="13" font-weight="400" data-squad-section="XI" data-roster-slot="1">☑ Van Breukelen · GK</text><text x="55" y="315" fill="#006C5B" font-size="12" font-weight="400">Ready</t