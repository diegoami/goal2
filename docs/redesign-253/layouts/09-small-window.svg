ng</text><text x="614" y="472" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">11</text><rect x="468" y="464" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="468" y="464" width="52.8" height="7" rx="3" fill="#006C5B" /><text x="376" y="501" fill="#182D36" font-size="13" font-weight="400">Passing</text><text x="614" y="501" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">18</text><rect x="468" y="493" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="468" y="493" width="86.39999999999999" height="7" rx="3" fill="#006C5B" /><text x="634" y="356" fill="#182D36" font-size="13" font-weight="400">Crossing</text><text x="872" y="356" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">4</text><rect x="726" y="348" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="726" y="348" width="19.2" height="7" rx="3" fill="#006C5B" /><text x="634" y="385" fill="#182D36" font-size="13" font-weight="400">Feinting</text><text x="872" y="385" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">11</text><rect x="726" y="377" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="726" y="377" width="52.8" height="7" rx="3" fill="#006C5B" /><text x="634" y="414" fill="#182D36" font-size="13" font-weight="400">Control</text><text x="872" y="414" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">18</text><rect x="726" y="406" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="726" y="406" width="86.39999999999999" height="7" rx="3" fill="#006C5B" /><text x="634" y="443" fill="#182D36" font-size="13" font-weight="400">Dribbling</text><text x="872" y="443" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">4</text><rect x="726" y="435" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="726" y="435" width="19.2" height="7" rx="3" fill="#006C5B" /><text x="634" y="472" fill="#182D36" font-size="13" font-weight="400">Shooting</text><text x="872" y="472" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">11</text><rect x="726" y="464" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="726" y="464" width="52.8" height="7" rx="3" fill="#006C5B" /><text x="634" y="501" fill="#182D36" font-size="13" font-weight="400">Penalties</text><text x="872" y="501" fill="#182D36" font-size="13" font-weight="600" text-anchor="end">18</text><rect x="726" y="493" width="120" height="7" rx="3" fill="#E0E8E4" /><rect x="726" y="493" width="86.39999999999999" height="7" rx="3" fill="#006C5B" /><text x="376" y="556" fill="#182D36" font-size="12" font-weight="400">Hardness 6</text><rect x="376" y="564" width="145" height="7" rx="3" fill="#E0E8E4" /><rect x="376" y="564" width="54.375" height="7" rx="3" fill="#006C5B" /><text x="549" y="556" fill="#182D36" font-size="12" font-weight="400">Fitness 24</text><rect x="549" y="564" width="145" height="7" rx="3" fill="#E0E8E4" /><rect x="549" y="564" width="108.75" height="7" rx="3" fill="#006C5B" /><text x="722" y="556" fill="#182D36" font-size="12" font-weight="400">Energy 28</text><rect x="722" y="564" width="145" height="7" rx="3" fill="#E0E8E4" /><rect x="722" y="564" width="126.875" height="7" rx="3" fill="#006C5B" /><text x="376" y="597" fill="#182D36" font-size="12" font-weight="400">Morale 20</text><rect x="376" y="605" width="145" height="7" rx="3" fill="#E0E8E4" /><rect x="376" y="605" width="90.625" height="7" rx="3" fill="#006C5B" /><text x="549" y="597" fill="#182D36" font-size="12" font-weight="400">Leadership 4</text><rect x="549" y="605" width="145" height="7" rx="3" fill="#E0E8E4" /><rect x="549" y="605" width="82.85714285714285" height="7" rx="3" fill="#006C5B" /><text x="376" y="645" fill="#435C62" font-size="12" font-weight="400">Player instructions + source  ▸   Team plan / captain  ▸</text><rect x="24" y="674" width="900" height="52" rx="0" fill="#FFFFFF" /><text x="42" y="705" fill="#182D36" font-size="13" font-weight="400">Draft · XI 11/11 · selected Koeman</text><rect x="557" y="681" width="133" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="569" y="706" fill="#182D36" font-size="14" font-weight="600">Discard</text><rect x="703" y="681" width="205" height="38" rx="6" fill="#006C5B" /><text x="715" y="706" fill="#FFFFFF" font-size="14" font-weight="600">Confirm team</text><rect x="956" y="210" width="328" height="449" rx="8" fill="#FFFFFF" stroke="#B7C6C3" /><text x="972" y="240" fill="#182D36" font-size="18" font-weight="700">Small-window relocation</text><text x="975" y="263" fill="#435C62" font-size="13" font-weight="400">All 20 names remain in Team.</text><text x="975" y="293" fill="#435C62" font-size="13" font-weight="400">The list has a visible scrollbar</text><text x="975" y="323" fill="#435C62" font-size="13" font-weight="400">and a named Bench 9 jump.</text><text x="975" y="353" fill="#435C62" font-size="13" font-weight="400" /><text x="975" y="383" fill="#435C62" font-size="13" font-weight="400">A subset fits beside the full card;</text><text x="975" y="413" fill="#435C62" font-size="13" font-weight="400">selection and draft stay pinned.</text><text x="975" y="443" fill="#435C62" font-size="13" font-weight="400">No separate page hides the bench.</text><text x="975" y="473" fill="#435C62" font-size="13" font-weight="400" /><text x="975" y="503" fill="#435C62" font-size="13" font-weight="400">At higher text scale use labelled</text><text x="975" y="533" fill="#435C62" font-size="13" font-weight="400">Roster / Player card panes.</text><text x="975" y="563" fill="#435C62" font-size="13" font-weight="400">Keyboard keeps the same return.</text><circle cx="910" cy="108" r="13" fill="#E5BA57" stroke="#182D36" /><text x="910" y="113" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="895" cy="231" r="13" fill="#E5BA57" stroke="#182D36" /><text x="895" y="236" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="895" cy="700" r="13" fill="#E5BA57" stroke="#182D36" /><text x="895" y="705" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Explicit client geometry</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">900×640 is a proposed minimum</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">at 1x/2x. The drawn client ends</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">at x924/y726; no larger shell</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">lies underneath it.</text><circle cx="1325" cy="361" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="366" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="365" fill="#182D36" font-size="16" font-weight="700">Find every squad member</text><text x="1312" y="393" fill="#435C62" font-size="14" font-weight="400">Scroll or jump to Bench 9</text><text x="1312" y="414" fill="#435C62" font-size="14" font-weight="400">without leaving Team. All 12</text><text x="1312" y="435" fill="#435C62" font-size="14" font-weight="400">skills and 5 characteristics</text><text x="1312" y="456" fill="#435C62" font-size="14" font-weight="400">stay readable beside the</text><text x="1312" y="477" fill="#435C62" font-size="14" font-weight="400">selected player; selected</text><text x="1312" y="498" fill="#435C62" font-size="14" font-weight="400">identities remain pinned.</text><circle cx="1325" cy="638" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="643" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="642" fill="#182D36" font-size="16" font-weight="700">Preserve the decision</text><text x="1312" y="670" fill="#435C62" font-size="14" font-weight="400">Confirm/Discard and the draft</text><text x="1312" y="691" fill="#435C62" font-size="14" font-weight="400">are fixed. Mouse and keyboard</text><text x="1312" y="712" fill="#435C62" font-size="14" font-weight="400">reach both roster sections; no</text><text x="1312" y="733" fill="#435C62" font-size="14" font-weight="400">hidden extra page or page-wide</text><text x="1312" y="754" fill="#435C62" font-size="14" font-weight="400">horizontal scroll.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>