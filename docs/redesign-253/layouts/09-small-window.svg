 y="210" width="328" height="449" rx="8" fill="#FFFFFF" stroke="#B7C6C3"/><text x="972" y="240" fill="#182D36" font-size="18" font-weight="700">Small-window rules</text><text x="975" y="263" fill="#435C62" font-size="13" font-weight="400">Header becomes compact.</text><text x="975" y="293" fill="#435C62" font-size="13" font-weight="400">Main navigation remains labelled.</text><text x="975" y="323" fill="#435C62" font-size="13" font-weight="400"></text><text x="975" y="353" fill="#435C62" font-size="13" font-weight="400">Roster and full selected card</text><text x="975" y="383" fill="#435C62" font-size="13" font-weight="400">share the usable content area.</text><text x="975" y="413" fill="#435C62" font-size="13" font-weight="400">All12 skills and5 characteristics</text><text x="975" y="443" fill="#435C62" font-size="13" font-weight="400">remain reachable in this context.</text><text x="975" y="473" fill="#435C62" font-size="13" font-weight="400"></text><text x="975" y="503" fill="#435C62" font-size="13" font-weight="400">At high text scaling use labelled</text><text x="975" y="533" fill="#435C62" font-size="13" font-weight="400">Roster / Player card panes.</text><text x="975" y="563" fill="#435C62" font-size="13" font-weight="400">Selection and action stay pinned.</text><circle cx="910" cy="108" r="13" fill="#E5BA57" stroke="#182D36"/><text x="910" y="113" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="895" cy="231" r="13" fill="#E5BA57" stroke="#182D36"/><text x="895" y="236" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="895" cy="700" r="13" fill="#E5BA57" stroke="#182D36"/><text x="895" y="705" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Use logical client size</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">900×640 is a proposed minimum</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">at1x/2x. Respect actual device</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">ratio and available window</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">geometry, not just requested</text><text x="1312" y="235" fill="#435C62" font-size="14" font-weight="400">scale.</text><circle cx="1325" cy="349" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="354" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="353" fill="#182D36" font-size="16" font-weight="700">Preserve the decision</text><text x="1312" y="381" fill="#435C62" font-size="14" font-weight="400">Reduce columns and switch panes</text><text x="1312" y="402" fill="#435C62" font-size="14" font-weight="400">before shrinking text. Card</text><text x="1312" y="423" fill="#435C62" font-size="14" font-weight="400">order and labels match the</text><text x="1312" y="444" fill="#435C62" font-size="14" font-weight="400">large desktop. No page-wide</text><text x="1312" y="465" fill="#435C62" font-size="14" font-weight="400">horizontal scroll.</text><circle cx="1325" cy="618" r="13" fill="#E5BA57" stroke="#182D36"/><text x="1325" y="623" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="622" fill="#182D36" font-size="16" font-weight="700">Keep actions reachable</text><text x="1312" y="650" fill="#435C62" font-size="14" font-weight="400">Draft state, selected</text><text x="1312" y="671" fill="#435C62" font-size="14" font-weight="400">identities and Confirm/Discard</text><text x="1312" y="692" fill="#435C62" font-size="14" font-weight="400">stay pinned. Scroll regions</text><text x="1312" y="713" fill="#435C62" font-size="14" font-weight="400">have visible bars, keyboard</text><text x="1312" y="734" fill="#435C62" font-size="14" font-weight="400">focus and a return path.</text><text x="24" y="934" fill="#435C62" font-size="15" font-weight="400">Planning annotation: shared shell and information requirements apply across toolkit options.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>