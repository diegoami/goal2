x="514" y="681" fill="#435C62" font-size="14" font-weight="400">Hardness / fitness / energy / morale in full profile</text><rect x="514" y="713" width="213" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="526" y="738" fill="#182D36" font-size="14" font-weight="600">View players</text><rect x="748" y="713" width="225" height="38" rx="6" fill="#FFFFFF" stroke="#B7C6C3" /><text x="760" y="738" fill="#182D36" font-size="14" font-weight="600">Complete country profile</text><rect x="1010" y="773" width="236" height="38" rx="6" fill="#006C5B" /><text x="1022" y="798" fill="#FFFFFF" font-size="14" font-weight="600">Choose Holland</text><circle cx="461" cy="217" r="13" fill="#E5BA57" stroke="#182D36" /><text x="461" y="222" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="1243" cy="214" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1243" y="219" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="1243" cy="789" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1243" y="794" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="1325" cy="119" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="124" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1347" y="123" fill="#182D36" font-size="16" font-weight="700">Compare before choosing</text><text x="1312" y="151" fill="#435C62" font-size="14" font-weight="400">Keep country list, selection</text><text x="1312" y="172" fill="#435C62" font-size="14" font-weight="400">and ranking order visible.</text><text x="1312" y="193" fill="#435C62" font-size="14" font-weight="400">Keyboard arrows browse; Enter</text><text x="1312" y="214" fill="#435C62" font-size="14" font-weight="400">on Choose advances.</text><circle cx="1325" cy="332" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="337" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1347" y="336" fill="#182D36" font-size="16" font-weight="700">Preserve country context</text><text x="1312" y="364" fill="#435C62" font-size="14" font-weight="400">All country categories have</text><text x="1312" y="385" fill="#435C62" font-size="14" font-weight="400">destinations. Unknown bar</text><text x="1312" y="406" fill="#435C62" font-size="14" font-weight="400">scales stay unknown. This is a</text><text x="1312" y="427" fill="#435C62" font-size="14" font-weight="400">concept profile, not current</text><text x="1312" y="448" fill="#435C62" font-size="14" font-weight="400">data.</text><circle cx="1325" cy="569" r="13" fill="#E5BA57" stroke="#182D36" /><text x="1325" y="574" fill="#182D36" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1347" y="573" fill="#182D36" font-size="16" font-weight="700">Deliberate new career</text><text x="1312" y="601" fill="#435C62" font-size="14" font-weight="400">Next: manager name and review.</text><text x="1312" y="622" fill="#435C62" font-size="14" font-weight="400">Launch offers Continue and</text><text x="1312" y="643" fill="#435C62" font-size="14" font-weight="400">Load. Replacement/save</text><text x="1312" y="664" fill="#435C62" font-size="14" font-weight="400">decisions are explicit;</text><text x="1312" y="685" fill="#435C62" font-size="14" font-weight="400">multiplayer awaits support.</text><text x="24" y="934" fill="#435C62" font-size="14" font-weight="600">FULL-PARITY TARGET · G05 profile/defaults and B06 naming need separately approved capabilities.</text><text x="24" y="960" fill="#435C62" font-size="14" font-weight="400">Original comparisons and field IDs: layouts.md / information-parity.md. Capability limits remain explicit.</text></g></svg>
