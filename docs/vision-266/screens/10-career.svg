<text x="194" y="123" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#152d34">A country over successive campaigns</text>
<text x="194" y="153" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#52656a">Longer-career target • later milestones, not states immediately after the Belgium friendly</text>
<rect x="170" y="863" width="1270" height="37" rx="0" fill="#e2e8e1"/>
<text x="194" y="886" font-family="DejaVu Sans" font-size="11" font-weight="400" fill="#52656a">DESIGNED • No game controls are active. Target review is not implementation approval.</text>
<rect x="194" y="185" width="600" height="235" rx="7" fill="white" stroke="#d1dbd5"/>
<text x="212" y="215" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#152d34">2030  /  pursue qualification</text>
<text x="214" y="247" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">Review the group and remaining fixtures.</text>
<text x="214" y="282" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">Earn finals or understand elimination.</text>
<text x="214" y="317" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">Blank future pairings stay unplayed.</text>
<text x="214" y="352" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">Do not fabricate automatic qualification.</text>
<rect x="814" y="185" width="600" height="235" rx="7" fill="white" stroke="#d1dbd5"/>
<text x="832" y="215" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#152d34">After the campaign</text>
<text x="834" y="247" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">Keep results, scorers and country records.</text>
<text x="834" y="282" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">Read supported bulletin consequences.</text>
<text x="834" y="317" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">Continue after disappointment.</text>
<text x="834" y="352" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52656a">A headline alone never means dismissal.</text>
<rect x="194" y="442" width="1220" height="295" rx="7" fill="white" stroke="#d1dbd5"/>
<text x="212" y="472" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#152d34">2032 and beyond  /  your country changes, your decisions continue</text>
<text x="216" y="506" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#52656a">Ageing, retirement and national-pool replacement belong to the complete career.</text>
<text x="216" y="545" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#52656a">Illustrative later record: P Bos leaves the squad; new candidate S van Rijn awaits comparison.</text>
<text x="216" y="584" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#52656a">No retirement threshold, generated record or automatic promotion is inferred from that example.</text>
<text x="216" y="623" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#52656a">Manager / national-team history, rankings, full profile and retained summaries tell the longer story.</text>
<text x="216" y="662" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#52656a">Complete local-manager play hands off the correct country without losing shared fixture/save ownership.</text>
<text x="194" y="790" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52656a">These are desired outcomes over existing evidenced contracts, not newly specified progression rules or a delivery plan.</text>
<text x="194" y="813" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52656a">Full country projections, generated news, durable records/replay and local-manager capability still need their named support.</text>
</svg>
