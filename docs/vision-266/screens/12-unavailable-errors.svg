<text x="194" y="790" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52656a">Save failure likewise keeps the prior good save and active career: Retry / Save elsewhere / Cancel.</text>
<text x="194" y="813" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52656a">Invalid lineup/exchange keeps the draft and names the actual refusal. No silent fallback to a new career or no-op button.</text>
