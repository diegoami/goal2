[project]
name = "goal2"
version = "0.1.0"
description = "Faithful rebuild of goal (version 2), New Era Software 1993, and its World Cup bot"
requires-python = ">=3.11"

[project.scripts]
goal2 = "goal2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goal2*"]
