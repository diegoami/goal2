[project]
name = "goal2"
version = "0.1.0"
description = "Faithful rebuild of goal (version 2), New Era Software 1993, and its World Cup bot"
requires-python = ">=3.11"

[project.optional-dependencies]
desktop = ["PySide6==6.12.0"]

[project.scripts]
goal2 = "goal2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goal2*"]

[tool.setuptools.package-data]
"goal2.web" = ["static/*.html", "static/*.mjs", "static/*.css"]
